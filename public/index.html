<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Marketplace</title>
  <!-- Supabase JS Client for Auth -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --primary: #4CAF50; --accent: #2196F3; --danger: #f44336; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 0; }
    header { background: #1a1a1a; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    h1, h2, h3 { margin: 0; }
    nav button { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-left: 8px; }
    nav button.active, nav button:hover { background: var(--primary); border-color: var(--primary); }
    .badge { background: var(--danger); border-radius: 50%; padding: 2px 7px; font-size: 11px; margin-left: 4px; }
    
    .view { display: none; padding: 30px; max-width: 1100px; margin: auto; }
    .view.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
    
    .card { background: var(--card); border-radius: 10px; overflow: hidden; padding: 15px; border: 1px solid #2a2a2a; display: flex; flex-direction: column; }
    .card img.thumb { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; background: #222; }
    .card-body { margin-top: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .price { font-size: 18px; color: var(--primary); font-weight: bold; margin: 10px 0; }
    
    button.btn-primary { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    button.btn-danger { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    button.btn-edit { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    
    /* Modals & Forms */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card); padding: 25px; border-radius: 10px; width: 90%; max-width: 450px; }
    input, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding: 10px 0; }
  </style>
</head>
<body>

  <header>
    <h2>⛏️ MC Addons Store</h2>
    <nav>
      <button class="active" onclick="switchView('store')">🛒 Store</button>
      <button onclick="openCart()">🛍️ Cart <span id="cartCount" class="badge">0</span></button>
      <button id="navDashboard" style="display:none;" onclick="switchView('dashboard')">🛠 Creator Studio</button>
      <button id="navProfile" style="display:none;" onclick="switchView('profile')">👤 My Library</button>
      <button id="authBtn" onclick="openAuthModal()">Login / Sign Up</button>
    </nav>
  </header>

  <!-- STORE VIEW -->
  <main id="storeView" class="view active">
    <h2>Available Addons</h2>
    <div id="productsGrid" class="grid"><p>Loading marketplace...</p></div>
  </main>

  <!-- CREATOR DASHBOARD VIEW -->
  <main id="dashboardView" class="view">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Creator Dashboard</h2>
      <button class="btn-primary" style="width: auto;" onclick="openProductModal()">+ Upload New Addon</button>
    </div>
    <div id="creatorProductsGrid" class="grid"></div>
  </main>

  <!-- USER PROFILE / LIBRARY VIEW -->
  <main id="profileView" class="view">
    <h2>My Purchased Addons</h2>
    <div id="libraryGrid" class="grid"></div>
  </main>

  <!-- CART MODAL -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <h2>Your Cart</h2>
      <div id="cartItemsList" style="margin: 15px 0; max-height: 200px; overflow-y: auto;"></div>
      <h3>Total: ฿<span id="cartTotal">0.00</span></h3>
      <div style="text-align: center; margin: 10px 0;">
        <img src="/qrcode.jpg" style="width: 140px; background: white; padding: 5px; border-radius: 6px;">
        <p style="font-size: 12px; color: #aaa;">Scan to pay the exact Total</p>
      </div>
      <form id="cartForm">
        <input type="file" id="cartSlip" accept="image/*" required>
        <button type="submit" class="btn-primary">Verify Slip & Download All</button>
      </form>
      <div id="cartStatus" style="margin-top: 10px; font-weight: bold;"></div>
      <button onclick="closeModal('cartModal')" style="margin-top: 10px; background: #333; color: white; border: none; padding: 8px; width: 100%; border-radius: 6px;">Close</button>
    </div>
  </div>

<!-- EXPANDED AUTH MODAL -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <h2 id="authTitle">Sign In</h2>
      
      <!-- Extra fields (Shown only during Sign Up) -->
      <div id="signUpFields" style="display: none;">
        <input type="text" id="authUsername" placeholder="Username / Creator Name (e.g. ModMaster)">
        <input type="text" id="authIgn" placeholder="Minecraft IGN (In-Game Name)">
      </div>

      <input type="email" id="authEmail" placeholder="Email Address" required>
      <input type="password" id="authPassword" placeholder="Password" required>
      
      <!-- Confirm Password (Shown only during Sign Up) -->
      <input type="password" id="authConfirmPassword" placeholder="Confirm Password" style="display: none;">

      <button class="btn-primary" onclick="handleAuth()" style="margin-top: 10px;">Submit</button>
      
      <p style="font-size: 13px; text-align: center; cursor: pointer; color: var(--accent); margin-top: 12px;" onclick="toggleAuthMode()" id="authToggleText">
        Need an account? Sign Up
      </p>
      
      <button onclick="closeModal('authModal')" style="background: transparent; color: #aaa; border: none; width: 100%; cursor: pointer;">Cancel</button>
    </div>
  </div>

  <!-- CREATE/EDIT PRODUCT MODAL -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <h2 id="modalProductTitle">Upload Addon</h2>
      <form id="productForm">
        <input type="hidden" id="editProductId">
        <input type="text" id="pName" placeholder="Addon Name" required>
        <textarea id="pDesc" placeholder="Description" rows="3"></textarea>
        <input type="number" step="0.01" id="pPrice" placeholder="Price (THB ฿)" required>
        
        <label style="font-size:12px; color:#aaa;">Thumbnail Image:</label>
        <input type="file" id="pThumb" accept="image/*">
        
        <label style="font-size:12px; color:#aaa;">Addon File (.mcaddon, .zip):</label>
        <input type="file" id="pFile">
        
        <button type="submit" class="btn-primary" style="margin-top: 10px;">Save & Publish</button>
      </form>
      <button onclick="closeModal('productModal')" style="margin-top: 8px; background: transparent; color: #aaa; border: none; width: 100%;">Cancel</button>
    </div>
  </div>

  <script>
    // --- SUPABASE CLIENT CONFIG ---
    const SUPABASE_URL = 'https://czuqcewdobkobohavbwo.supabase.co'; // Your URL
    const SUPABASE_ANON_KEY = 'sb_publishable_2vycFL8nvwoEpWCW3oEYBQ_RqEnIIJF'; // Replace with your Public Anon Key
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let isSignUp = false;
    let cart = [];

    // --- INIT AUTH STATE ---
    supabaseClient.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user || null;
      updateAuthUI();
      if (currentUser) {
        loadCreatorProducts();
        loadUserLibrary();
      }
    });



    // --- NAVIGATION ---
    function switchView(viewName) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(`${viewName}View`).classList.add('active');
      if (viewName === 'store') loadStoreProducts();
      if (viewName === 'dashboard') loadCreatorProducts();
      if (viewName === 'profile') loadUserLibrary();
    }

    // --- 1. STORE VIEW ---
    async function loadStoreProducts() {
      const res = await fetch('/api/products');
      const products = await res.json();
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';
      
      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img class="thumb" src="${p.thumbnail_url || 'https://via.placeholder.com/260x150?text=No+Thumbnail'}" alt="${p.name}">
          <div class="card-body">
            <h3>${p.name}</h3>
            <p style="font-size: 13px; color: #bbb;">${p.description || ''}</p>
            <div class="price">฿${parseFloat(p.price).toFixed(2)}</div>
            <button class="btn-primary" onclick="addToCart('${p.id}', '${p.name.replace(/'/g, "\\'")}', ${p.price})">🛒 Add to Cart</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // --- 2. CART SYSTEM ---
    function addToCart(id, name, price) {
      if (!cart.some(item => item.id === id)) {
        cart.push({ id, name, price });
        updateCartBadge();
        alert(`Added ${name} to cart!`);
      } else {
        alert('Item already in cart!');
      }
    }

    function updateCartBadge() {
      document.getElementById('cartCount').textContent = cart.length;
    }

    function openCart() {
      const list = document.getElementById('cartItemsList');
      list.innerHTML = '';
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;
        list.innerHTML += `
          <div class="cart-item">
            <span>${item.name} (฿${item.price.toFixed(2)})</span>
            <button onclick="removeFromCart(${index})" class="btn-danger">✕</button>
          </div>
        `;
      });

      document.getElementById('cartTotal').textContent = total.toFixed(2);
      document.getElementById('cartModal').classList.add('active');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartBadge();
      openCart();
    }

    document.getElementById('cartForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('cartStatus');
      const slipFile = document.getElementById('cartSlip').files[0];
      if (!cart.length) return alert('Your cart is empty!');

      const session = (await supabaseClient.auth.getSession()).data.session;
      const formData = new FormData();
      formData.append('slip', slipFile);
      formData.append('productIds', JSON.stringify(cart.map(i => i.id)));

      status.style.color = '#ffeb3b';
      status.textContent = 'Verifying slip with SlipOK...';

      try {
        const res = await fetch('/api/verify-cart-payment', {
          method: 'POST',
          headers: session ? { 'Authorization': `Bearer ${session.access_token}` } : {},
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          status.style.color = '#4CAF50';
          let downloadHtml = '<b>Payment Successful! Downloads:</b><br>';
          data.downloads.forEach(d => {
            downloadHtml += `<a href="${d.downloadUrl}" style="color: #4CAF50; display:block; margin: 5px 0;" download>⬇️ Download ${d.name}</a>`;
          });
          status.innerHTML = downloadHtml;
          cart = [];
          updateCartBadge();
        } else {
          status.style.color = '#f44336';
          status.textContent = data.message;
        }
      } catch (err) {
        status.style.color = '#f44336';
        status.textContent = 'Verification error.';
      }
    });

    // --- 3. CREATOR DASHBOARD CRUD ---
    async function loadCreatorProducts() {
      const session = (await supabaseClient.auth.getSession()).data.session;
      if (!session) return;
      
      const res = await fetch('/api/creator/products', {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      const products = await res.json();
      const grid = document.getElementById('creatorProductsGrid');
      grid.innerHTML = '';

      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img class="thumb" src="${p.thumbnail_url || 'https://via.placeholder.com/260x150?text=No+Thumbnail'}">
          <div class="card-body">
            <h3>${p.name}</h3>
            <div class="price">฿${p.price}</div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
              <button class="btn-edit" onclick="openEditProduct('${p.id}', '${p.name.replace(/'/g, "\\'")}', '${(p.description || '').replace(/'/g, "\\'")}', ${p.price})">Edit</button>
              <button class="btn-danger" onclick="deleteProduct('${p.id}')">Delete</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openProductModal() {
      document.getElementById('editProductId').value = '';
      document.getElementById('modalProductTitle').textContent = 'Upload New Addon';
      document.getElementById('productForm').reset();
      document.getElementById('pFile').required = true;
      document.getElementById('productModal').classList.add('active');
    }

    function openEditProduct(id, name, desc, price) {
      document.getElementById('editProductId').value = id;
      document.getElementById('modalProductTitle').textContent = 'Edit Addon';
      document.getElementById('pName').value = name;
      document.getElementById('pDesc').value = desc;
      document.getElementById('pPrice').value = price;
      document.getElementById('pFile').required = false; // Optional when editing
      document.getElementById('productModal').classList.add('active');
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editProductId').value;
      const session = (await supabaseClient.auth.getSession()).data.session;
      
      const formData = new FormData();
      formData.append('name', document.getElementById('pName').value);
      formData.append('description', document.getElementById('pDesc').value);
      formData.append('price', document.getElementById('pPrice').value);
      if (document.getElementById('pThumb').files[0]) formData.append('thumbnail', document.getElementById('pThumb').files[0]);
      if (document.getElementById('pFile').files[0]) formData.append('productFile', document.getElementById('pFile').files[0]);

      const url = id ? `/api/creator/products/${id}` : '/api/creator/products';
      const method = id ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method,
        headers: { 'Authorization': `Bearer ${session.access_token}` },
        body: formData
      });
      const data = await res.json();
      if (data.success) {
        closeModal('productModal');
        loadCreatorProducts();
      } else {
        alert(data.message);
      }
    });

    async function deleteProduct(id) {
      if (!confirm('Are you sure you want to delete this product?')) return;
      const session = (await supabaseClient.auth.getSession()).data.session;
      await fetch(`/api/creator/products/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      loadCreatorProducts();
    }

    // --- 4. PROFILE / LIBRARY ---
    async function loadUserLibrary() {
      const session = (await supabaseClient.auth.getSession()).data.session;
      if (!session) return;
      
      const res = await fetch('/api/user/library', {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      const purchases = await res.json();
      const grid = document.getElementById('libraryGrid');
      grid.innerHTML = '';

      if (!purchases.length) {
        grid.innerHTML = '<p>You have not bought any addons yet.</p>';
        return;
      }

      purchases.forEach(item => {
        const p = item.products;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img class="thumb" src="${p.thumbnail_url || 'https://via.placeholder.com/260x150?text=No+Thumbnail'}">
          <div class="card-body">
            <h3>${p.name}</h3>
            <p style="font-size:12px; color:#888;">Purchased on: ${new Date(item.created_at).toLocaleDateString()}</p>
            <a href="${p.file_url}" class="btn-primary" style="text-align:center; text-decoration:none; display:block; margin-top:10px;" download>⬇️ Download Addon</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // --- AUTH HELPERS ---
    function openAuthModal() { document.getElementById('authModal').classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    // --- TOGGLE BETWEEN LOGIN & SIGN UP ---
    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById('authTitle').textContent = isSignUp ? 'Create Creator/Player Account' : 'Sign In';
      document.getElementById('authToggleText').textContent = isSignUp ? 'Already have an account? Sign In' : 'Need an account? Sign Up';
      
      // Show/Hide the extra sign-up fields
      document.getElementById('signUpFields').style.display = isSignUp ? 'block' : 'none';
      document.getElementById('authConfirmPassword').style.display = isSignUp ? 'block' : 'none';
    }

    // --- HANDLE SIGN UP & LOGIN WITH METADATA ---
    async function handleAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      
      if (!email || !password) {
        alert('Please fill in all required fields.');
        return;
      }

      if (isSignUp) {
        const username = document.getElementById('authUsername').value.trim();
        const minecraftIgn = document.getElementById('authIgn').value.trim();
        const confirmPassword = document.getElementById('authConfirmPassword').value;

        if (!username) {
          alert('Please enter a username.');
          return;
        }

        if (password !== confirmPassword) {
          alert('Passwords do not match!');
          return;
        }

        if (password.length < 6) {
          alert('Password must be at least 6 characters long.');
          return;
        }

        // Send additional user metadata directly to Supabase
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: {
              username: username,
              minecraft_ign: minecraftIgn || 'Steve'
            }
          }
        });

        if (error) {
          alert(error.message);
        } else {
          alert(`Account created successfully for ${username}! You can now sign in.`);
          toggleAuthMode(); // Switch back to login view
        }

      } else {
        // Sign In
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          alert(error.message);
        } else {
          closeModal('authModal');
        }
      }
    }

    // --- UPDATE UI WITH CUSTOM USERNAME ---
    function updateAuthUI() {
      const authBtn = document.getElementById('authBtn');
      const navDash = document.getElementById('navDashboard');
      const navProf = document.getElementById('navProfile');
      
      if (currentUser) {
        // Read custom username from Supabase metadata
        const displayName = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
        const ign = currentUser.user_metadata?.minecraft_ign ? ` [IGN: ${currentUser.user_metadata.minecraft_ign}]` : '';

        authBtn.textContent = `Logout (${displayName}${ign})`;
        authBtn.onclick = () => supabaseClient.auth.signOut();
        navDash.style.display = 'inline-block';
        navProf.style.display = 'inline-block';
      } else {
        authBtn.textContent = 'Login / Sign Up';
        authBtn.onclick = openAuthModal;
        navDash.style.display = 'none';
        navProf.style.display = 'none';
      }
    }

    // Initial Load
    loadStoreProducts();
  </script>
</body>
</html>
